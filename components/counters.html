<!-- 1. ANIMATED COUNTERS -->
<section class="section" id="s1">
  <div class="section-label reveal">
    <span class="section-num">01</span>
    <h2 class="section-title">Animated Counters</h2>
  </div>
  <p class="section-desc reveal">jQuery's <code>.animate()</code> with custom step callbacks to tween numeric values. Triggered by viewport entry via scroll detection.</p>

  <div class="demo-card reveal">
    <h3>Key Stats <span class="badge">$.animate + scroll</span></h3>
    <div class="counters-grid">
      <div class="counter-box">
        <span class="counter-num" data-target="148">0</span>
        <span class="counter-label">Projects Delivered</span>
      </div>
      <div class="counter-box">
        <span class="counter-num" data-target="3200000">0</span>
        <span class="counter-label">Users Reached</span>
      </div>
      <div class="counter-box">
        <span class="counter-num" data-target="99">0</span>
        <span class="counter-label">% Client Satisfaction</span>
      </div>
      <div class="counter-box">
        <span class="counter-num" data-target="12">0</span>
        <span class="counter-label">Years Experience</span>
      </div>
    </div>
    <button class="btn btn-filled" id="trigger-counter">↺ Replay Animation</button>
  </div>
</section>
