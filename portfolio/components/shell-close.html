    </div>
    <div class="book-controls">
      <button class="flip-btn" id="flip-prev" aria-label="Previous page">←</button>
      <span id="page-indicator">1 / 1</span>
      <button class="flip-btn" id="flip-next" aria-label="Next page">→</button>
      <label class="autoflip-label" for="autoflip-toggle">
        <input type="checkbox" id="autoflip-toggle"> Auto
      </label>
      <span class="autoflip-interval">
        <input type="number" id="autoflip-interval" value="600" min="350" step="50" aria-label="Auto-flip interval in milliseconds"> ms
      </span>
    </div>
  </div>
</div>
